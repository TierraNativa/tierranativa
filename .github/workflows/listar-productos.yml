name: Listar productos

# Genera productos.tsv (código, activo, descripción de cada producto) y lo
# commitea en la misma rama.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
    paths:
      - "listar-productos.js"
      - ".github/workflows/listar-productos.yml"

permissions:
  contents: write

jobs:
  listar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repo
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias
        run: npm install @supabase/supabase-js dotenv

      - name: Listar
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node listar-productos.js | grep '^PROD' | cut -f2- > productos.tsv

      - name: Commitear productos.tsv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add productos.tsv
          git diff --cached --quiet || git commit -m "productos.tsv actualizado"
          git push
